<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KayRobot - Connexion Discord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            discord: {
              blurple: '#5865F2',
              darkBg: '#313338',
              cardBg: '#1E1F22',
              sidebarBg: '#2B2D31',
              inputBg: '#111214'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-discord-darkBg text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-discord-cardBg border border-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-6">
    <!-- Logo & Titre -->
    <div class="flex flex-col items-center space-y-3">
      <div class="w-16 h-16 rounded-full bg-discord-blurple flex items-center justify-center font-bold text-white text-2xl shadow-lg ring-4 ring-discord-blurple/30">
        K
      </div>
      <div>
        <h1 class="text-2xl font-bold text-white">KayRobot Console</h1>
        <p class="text-xs text-gray-400 mt-1">Identifiant Bot : 1563284812351938611</p>
      </div>
    </div>

    <!-- Message de statut -->
    <div id="auth-status-msg" class="bg-discord-inputBg p-3 rounded-lg border border-gray-800 text-xs text-gray-400">
      Connectez-vous avec votre compte Discord pour accéder à la console d'administration.
    </div>

    <!-- Bouton de connexion Discord -->
    <div class="space-y-3">
      <button id="btn-login-discord" class="w-full bg-discord-blurple hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center space-x-2 shadow-lg">
        <i class="fa-brands fa-discord text-xl"></i>
        <span>Se connecter avec Discord</span>
      </button>
    </div>

    <!-- Info OAuth / Handler -->
    <div class="pt-4 border-t border-gray-800 text-left">
      <p class="text-[11px] text-gray-500 leading-relaxed">
        <i class="fa-solid fa-shield-halved text-discord-blurple mr-1"></i>
        Redirect URI Firebase Auth :<br>
        <code class="text-discord-blurple select-all text-[10px] break-all">https://kayrobot-discord.firebaseapp.com/__/auth/handler</code>
      </p>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
