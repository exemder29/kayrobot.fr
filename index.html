<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KayroBot – Le bot Discord de modération, tickets et annonces</title>
  <meta name="description" content="KayroBot modère ton serveur Discord, gère les tickets, programme tes messages et crée la structure du serveur. Commandes en français et tableau de bord web.">
  <meta property="og:title" content="KayroBot, le bot Discord en français">
  <meta property="og:description" content="Modération, tickets, messages programmés et tableau de bord web.">
  <meta property="og:image" content="https://kayrobot.fr/logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="landing.css">
<script>
  (function () {
    var p = location.pathname.replace(/index\.html$/, '').replace(/\.html$/, '');
    if (p !== location.pathname) history.replaceState(null, '', p + location.search + location.hash);
  })();
</script>
</head>
<body>

<header class="lp-header">
  <div class="lp-wrap lp-bar">
    <a class="lp-brand" href="#accueil"><img src="logo.png" alt="" width="36" height="36"> KayroBot</a>
    <button class="lp-burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
    <nav class="lp-nav" id="nav" aria-label="Navigation principale">
      <a class="link" href="#accueil">Accueil</a>
      <a class="link" href="#fonctionnalites">Fonctionnalités</a>
      <a class="link" href="#commandes">Commandes</a>
      <a class="link" href="#aide">Aide</a>
      <a class="link" href="#statut">Statut</a>
      <a class="link" href="dashboard">Dashboard</a>
      <div class="cta">
        <a class="btn btn-ghost btn-small" id="login-link" href="https://discord.com/oauth2/authorize?client_id=1563284812351938611&redirect_uri=https%3A%2F%2Fexemder29.github.io%2Fkayrobot.fr%2Fdashboard.html&response_type=token&scope=identify%20guilds">Connexion</a>
        <a class="btn btn-primary btn-small" href="https://discord.com/oauth2/authorize?client_id=1563284812351938611&permissions=8&integration_type=0&scope=bot+applications.commands" target="_blank" rel="noopener">Inviter</a>
      </div>
    </nav>
  </div>
</header>

<main>
  <section class="lp-hero" id="accueil">
    <div class="lp-wrap lp-hero-grid">
      <div>
        <h1>Modère, organise et annonce sans quitter Discord.</h1>
        <p class="sub">KayroBot s'occupe de la modération, des tickets, des messages programmés et de la structure de ton serveur.</p>
        <div class="lp-actions">
          <a class="btn btn-primary" href="https://discord.com/oauth2/authorize?client_id=1563284812351938611&permissions=8&integration_type=0&scope=bot+applications.commands" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i> Ajouter à Discord</a>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const BOT_PROXY_URL = 'https://kayrobot-proxy.exem029.workers.dev';
(async () => {
  const api = document.getElementById('st-api');
  const guilds = document.getElementById('st-guilds');
  if (!api || !guilds) return;
  try {
    const res = await fetch(`${BOT_PROXY_URL}/__stats`);
    const d = await res.json();
    if (!d.ok) throw new Error('refus');
    api.textContent = 'Opérationnel'; api.className = 'v ok';
    guilds.textContent = d.serveurs != null ? Number(d.serveurs).toLocaleString('fr-FR') : 'Non communiqué';
  } catch (e) {
    api.textContent = 'Indisponible'; api.className = 'v bad';
    guilds.textContent = 'Non communiqué';
  }
})();
</script>
</body>
</html>
